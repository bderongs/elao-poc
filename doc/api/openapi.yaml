                          pronunciation: "La prononciation est claire ; quelques voyelles nasales restent hésitantes."
                          fluency: "Le débit est régulier, avec des pauses surtout sur les sujets abstraits."
                          vocabulary_grammar: "Le vocabulaire est varié ; les accords du participe passé restent fragiles."
