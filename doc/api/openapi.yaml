        "409":
          description: The test is not `graded` (yet, or it ended in `error`). The body gives its current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: result_not_available
                  message: "The test is completed and being graded."
                  status: completed

webhooks:
  test.completed:
    post:
      operationId: onTestCompleted
      summary: The conversation is over, grading has started
      description: |
        Sent once, when a test becomes `completed`. `result` is null; `test.graded` (or
        `test.error`) follows within 15 minutes.

        All webhooks of a test go to its `completed_callback_url` when one was given to
        `POST /tests`, otherwise to the default URL configured with ELAO. With neither, no webhook
        is sent. Signature and delivery: see "Verifying a webhook" at the top.
      parameters:
        - $ref: "#/components/parameters/Signature"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
            example:
              event_id: "evt_01JD8R4N2Q6Z7Y3K5M9P0T1V2W"
              event: test.completed
              test_id: "6f1c2a9e-3b4d-4c8a-9e21-7d5b0f3a1c44"
              external_ref: "candidate-48213"
              status: completed
              sent_at: "2026-11-10T14:07:41Z"
              result: null
      responses:
        "2XX":
          description: Received.
  test.graded:
    post:
      operationId: onTestGraded
      summary: A test has been graded
      description: |
        Sent once, when a test becomes `graded`. `result` is the same object as
        `GET /tests/{test_id}/result?detail=summary`; call that endpoint with `standard` or `full`
        for more. Same URL, signature and delivery as `test.completed`.
      parameters:
        - $ref: "#/components/parameters/Signature"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
            example:
              event_id: "evt_01JD8R5B7H2C4D6F8G0J1K3L5M"
              event: test.graded
              test_id: "6f1c2a9e-3b4d-4c8a-9e21-7d5b0f3a1c44"
              external_ref: "candidate-48213"
              status: graded
              sent_at: "2026-11-10T14:08:06Z"
              result:
                test_id: "6f1c2a9e-3b4d-4c8a-9e21-7d5b0f3a1c44"
                external_ref: "candidate-48213"
                language: fr
                interface_language: fr
                detail: summary
                completed_at: "2026-11-10T14:07:40Z"
                graded_at: "2026-11-10T14:08:05Z"
                duration_seconds: 329
                answer_count: 9
                level: B2
                score: 72
      responses:
        "2XX":
          description: Received.
  test.error:
    post:
      operationId: onTestError
      summary: A test could not be graded
      description: |
        Sent once, when a test becomes `error`. `result` is null. Same URL, signature and delivery
        as `test.completed`. Create a new test for another attempt.
      parameters:
        - $ref: "#/components/parameters/Signature"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "2XX":
          description: Received.

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "The API key ELAO gives you: `Authorization: Bearer <key>`."

  parameters:
    TestId:
      name: test_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Signature:
      name: X-Elao-Signature
      in: header
      required: true
      description: "`t=<unix seconds>,v1=<hex HMAC-SHA256 of \"<t>.<raw body>\">` — see \"Verifying a webhook\"."
      schema:
        type: string
        example: "t=1762783686,v1=5d41402abc4b2a76b9719d911017c592ae2f…"

  responses:
    BadRequest:
      description: Invalid request (a field is missing or has a wrong value).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_request
              message: "language: must be one of fr, en, nl-BE, nl-NL, es, it, de"
    Unauthorized:
      description: Missing or wrong API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: "Missing or invalid API key."
    NotFound:
      description: No test with this id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: "No test with this id."

  examples:
    ResultSummaryValue:
      summary: detail=summary
      value:
        test_id: "6f1c2a9e-3b4d-4c8a-9e21-7d5b0f3a1c44"
        external_ref: "candidate-48213"
        language: fr
        interface_language: fr
        detail: summary
        completed_at: "2026-11-10T14:07:40Z"
        graded_at: "2026-11-10T14:08:05Z"
        duration_seconds: 329
        answer_count: 9
        level: B2
        score: 72

  schemas:
    Language:
      type: string
      enum: [fr, en, nl-BE, nl-NL, es, it, de]
      description: Language tested. `nl-BE` is Dutch as spoken in Belgium, `nl-NL` in the Netherlands.

    InterfaceLanguage:
      type: string
      enum: [fr, en, nl, es, it, de]
      default: fr
      description: |
        Language of the screens the candidate sees, and of the written feedback in the result.
        Independent of the language tested.

    Level:
      type: string
      enum: [A0, A1, A2, B1, B2, C1, C2]
      description: CEFR level. The same list for the level reported, the start level and each question's level.

    DetailedLevel:
      type: string
      enum: [A0, A1, A1+, A2, A2+, B1, B1+, B2, B2+, C1, C1+, C2]
      description: |
        ELAO Speaking's own finer split: each level from A1 to C1 in two halves, the upper one with
        "+" (with the default bands, B1 is 60–64 and B1+ 65–69). A0 and C2 are not split. Always
        agrees with `level` (`level` is this without the "+"). It is our split, not your scale's
        sub-levels: to map onto those, use `score` and `advanced.level_scale`.

    StartLevel:
      description: Level of the first questions (any `Level` but A0). When omitted, the default set for the language is used.
      allOf:
        - $ref: "#/components/schemas/Level"
        - not:
            const: A0

    Status:
      type: string
      enum: [created, in_progress, completed, graded, error]
      description: See "Statuses" at the top.

    CreateTestRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: "#/components/schemas/Language"
        interface_language:
          $ref: "#/components/schemas/InterfaceLanguage"
        start_level:
          $ref: "#/components/schemas/StartLevel"
        external_ref:
          type: string
          maxLength: 200
          description: Your own reference for this test or candidate. Returned in every response and webhook.
        redirect_url:
          type: string
          format: uri
          description: Where the candidate is sent at the end of the test.
        completed_callback_url:
          type: string
          format: uri
          pattern: "^https://"
          description: |
            Where to send this test's webhooks (`test.completed`, `test.graded`, `test.error`),
            instead of the default URL configured with ELAO. HTTPS only.

    Test:
      type: object
      required: [test_id, external_ref, status, language, interface_language, start_level, test_url, completed_callback_url, created_at, started_at, completed_at, graded_at]
      properties:
        test_id:
          type: string
          format: uuid
        external_ref:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/Status"
        language:
          $ref: "#/components/schemas/Language"
        interface_language:
          $ref: "#/components/schemas/InterfaceLanguage"
        start_level:
          oneOf:
            - $ref: "#/components/schemas/StartLevel"
            - type: "null"
          description: Null when the language's default start level is used.
        test_url:
          type: string
          format: uri
          description: The link to give the candidate.
        completed_callback_url:
          type: [string, "null"]
          format: uri
          description: As given to `POST /tests`; null when the default URL is used.
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
          description: When the candidate gave the first answer.
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When the conversation ended.
        graded_at:
          type: [string, "null"]
          format: date-time
          description: When the result became available.

    LevelBand:
      type: object
      required: [level, min_score]
      properties:
        level:
          $ref: "#/components/schemas/Level"
        min_score:
          type: integer
          description: Lowest score of this level. The level runs up to the next band's `min_score` − 1 (C2 up to 100).

    Axes:
      type: object
      required: [pronunciation, fluency, vocabulary_grammar, communication]
      description: |
        Each axis from 0 to 100, as the evaluator scored it. The level is computed from these four,
        after a few scoring rules (for example, fluency is held to what the speaking rate allows).
      properties:
        pronunciation:
          type: [integer, "null"]
          description: |
            Null only when no answer could be scored for pronunciation (every answer too short, or
            the pronunciation engine failed on all of them). The level is then computed from the
            other three axes.
        fluency:
          type: integer
        vocabulary_grammar:
          type: integer
        communication:
          type: integer

    AxisFeedback:
      type: object
      required: [pronunciation, fluency, vocabulary_grammar, communication]
      description: A few words of appreciation per axis, one short sentence each, consistent with the axis score.
      properties:
        pronunciation:
          type: string
          description: Empty when the pronunciation could not be measured (`axes.pronunciation` null).
        fluency:
          type: string
        vocabulary_grammar:
          type: string
        communication:
          type: string

    Feedback:
      type: object
      required: [translated, axis_feedback, general_summary, strengths, areas_for_improvement, notable_errors]
      properties:
        translated:
          type: boolean
          description: |
            False for `en` (the original) — and for another language whose translation failed after
            retries, which then carries the English text.
        axis_feedback:
          $ref: "#/components/schemas/AxisFeedback"
        general_summary:
          type: string
          description: The overall appreciation, 2 to 3 sentences.
        strengths:
          type: array
          items:
            type: string
        areas_for_improvement:
          type: array
          items:
            type: string
        notable_errors:
          type: array
          items:
            type: string
          description: Candidate's words and their correction, quoted in the language tested.

    FeedbackByLanguage:
      type: object
      required: [en]
      description: |
        The written feedback, keyed by language: always `en` (the original), plus the test's
        `interface_language` when it is another one (`fr` for a French interface, `nl` for a Dutch
        one…).
      properties:
        en:
          $ref: "#/components/schemas/Feedback"
        fr:
          $ref: "#/components/schemas/Feedback"
        nl:
          $ref: "#/components/schemas/Feedback"
        es:
          $ref: "#/components/schemas/Feedback"
        it:
          $ref: "#/components/schemas/Feedback"
        de:
          $ref: "#/components/schemas/Feedback"

    WordScore:
      type: object
      required: [word, score]
      properties:
        word:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Pronunciation of this word. As coloured on our results screen: 80 and above correct,
            60–79 acceptable, 35–59 mispronounced, below 35 incorrect.

    Turn:
      type: object
      description: |
        One answer of the candidate. The test is a conversation, so follow-up questions are turns too.
        There is no score per answer: the level and the axes are judged over the whole test.
      properties:
        index:
          type: integer
          description: 1 for the first question.
        question:
          type: string
          description: What the examiner said.
        answer:
          type: string
          description: Transcript of the candidate's answer.
        question_level:
          oneOf:
            - $ref: "#/components/schemas/Level"
            - type: "null"
          description: Level of the question asked (never A0).
        judge_verdict:
          type: [string, "null"]
          enum: [well, adequate, struggled, null]
          description: |
            How the candidate handled this question for its level, as judged during the test to pick
            the next question's level. A pacing signal, not a score.
        pronunciation:
          type: [integer, "null"]
          description: Pronunciation score of this answer, 0–100. Null for an answer too short to score.
        word_count:
          type: integer
        speaking_rate:
          type: [integer, "null"]
          description: Words per minute, long pauses capped. Null for an answer too short to time.
        word_scores:
          type: array
          items:
            $ref: "#/components/schemas/WordScore"
          description: The answer word by word, with each word's pronunciation score. Empty when the answer was not scored.
        audio_url:
          type: [string, "null"]
          format: uri
          description: |
            The candidate's recording of this answer: a signed link, valid until `audio_expires_at`
            (2 hours after this call). Null when there is no recording (the upload failed) or it is
            past the retention period.
        audio_expires_at:
          type: [string, "null"]
          format: date-time
          description: When `audio_url` stops working. Null with `audio_url`.
        response_delay_seconds:
          type: [number, "null"]
          description: Silence between the end of the question and the start of the answer.
        answer_seconds:
          type: [number, "null"]
          description: How long the candidate spoke.
        help:
          type: object
          description: What the candidate asked for on this question.
          properties:
            repeated:
              type: boolean
              description: Asked for the question to be repeated.
            not_understood:
              type: boolean
              description: Said they did not understand; the question was rephrased or replaced.
            skipped:
              type: boolean
              description: Skipped the question.

    Integrity:
      type: object
      description: Signals that the candidate may have had help. Information only, they do not change the score.
      properties:
        level:
          type: string
          enum: [none, low, high]
        reasons:
          type: array
          items:
            type: string
        window_changes:
          type: integer
          description: Times the candidate left the test window.
        away_seconds:
          type: number
        long_silences:
          type: integer

    ResultSummary:
      type: object
      required: [test_id, external_ref, language, interface_language, detail, completed_at, graded_at, duration_seconds, answer_count, level, score]
      properties:
        test_id:
          type: string
          format: uuid
        external_ref:
          type: [string, "null"]
        language:
          $ref: "#/components/schemas/Language"
        interface_language:
          $ref: "#/components/schemas/InterfaceLanguage"
        detail:
          type: string
          enum: [summary, standard, full]
        completed_at:
          type: string
          format: date-time
        graded_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
        answer_count:
          type: integer
        level:
          $ref: "#/components/schemas/Level"
        score:
          type: integer
          minimum: 0
          maximum: 100

    Advanced:
      type: object
      required: [detailed_level, confidence, level_scale, integrity]
      description: To go finer than `level`. Safe to ignore if the level is all you need.
      properties:
        detailed_level:
          $ref: "#/components/schemas/DetailedLevel"
        confidence:
          type: string
          enum: [high, medium, low]
          description: How sure the evaluator is of the level.
        level_scale:
          type: array
          items:
            $ref: "#/components/schemas/LevelBand"
          description: The score bands used for this test, A0 to C2. Use them with `score` to place the candidate within a level.
        integrity:
          oneOf:
            - $ref: "#/components/schemas/Integrity"
            - type: "null"
          description: Null when integrity tracking was off.

    ResultStandard:
      allOf:
        - $ref: "#/components/schemas/ResultSummary"
        - type: object
          required: [axes, feedback]
          properties:
            axes:
              $ref: "#/components/schemas/Axes"
            feedback:
              $ref: "#/components/schemas/FeedbackByLanguage"

    ResultFull:
      allOf:
        - $ref: "#/components/schemas/ResultStandard"
        - type: object
          required: [turns, advanced]
          properties:
            turns:
              type: array
              items:
                $ref: "#/components/schemas/Turn"
            advanced:
              $ref: "#/components/schemas/Advanced"

    WebhookEvent:
      type: object
      required: [event_id, event, test_id, external_ref, status, sent_at, result]
      properties:
        event_id:
          type: string
          description: Unique per event, the same on every retry of it. Use it to ignore duplicates.
        event:
          type: string
          enum: [test.completed, test.graded, test.error]
        test_id:
          type: string
          format: uuid
        external_ref:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/Status"
        sent_at:
          type: string
          format: date-time
          description: When this attempt was sent.
        result:
          description: For `test.graded`, the `summary` result (same as `GET /tests/{test_id}/result?detail=summary`); otherwise null.
          oneOf:
            - $ref: "#/components/schemas/ResultSummary"
            - type: "null"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, unauthorized, not_found, result_not_available, rate_limited, internal_error]
            message:
              type: string
            status:
              $ref: "#/components/schemas/Status"
              description: Only with `result_not_available`.
