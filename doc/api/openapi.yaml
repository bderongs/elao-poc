openapi: 3.1.0
info:
  title: ELAO Speaking API
  version: 1.0.0-draft.2
  description: |
    Order an oral language test, send the candidate to it, then read its status and result.

    **Flow**
    1. `POST /tests` creates a test and returns its `test_id` and the `test_url` to give the candidate.
    2. The candidate opens `test_url` and takes the test in the browser (3 to 7 minutes).
    3. Wait for the `test.graded` webhook (or `test.error`), or poll `GET /tests/{test_id}` until
       `status` is `graded` or `error`.
    4. `GET /tests/{test_id}/result` returns the result, at the level of detail asked for.

    **Statuses**
    | Status | Meaning |
    |---|---|
    | `created` | Test created, the candidate has not started yet. |
    | `in_progress` | The candidate has started. A test the candidate leaves before the end stays `in_progress`. |
    | `completed` | The conversation is over; the test is being graded. |
    | `graded` | Graded. The result is available and will not change. |
    | `error` | The conversation is over, but grading failed. No result. |

    A test goes from `completed` to `graded` (or `error`) within **15 minutes**, usually under one.
    Tests are neither cancelled nor expired: a test that is never started stays `created`, one the
    candidate leaves stays `in_progress`. For a new attempt, create a new test.

    **The result is fixed.** It is computed once, at grading, and every later call returns the same
    values, even if the scoring rules change afterwards. The one exception is the audio links of
    detail `full`, which are new on each call (see "Audio").

    **Audio.** With detail `full`, each answer gives `audio_url`, a link to the candidate's
    recording of that answer. The link is signed and works for 2 hours: call the result again for a
    fresh one rather than storing it, or download the file if you want to keep it. Formats: WebM
    (Opus) or MP4 (AAC) depending on the candidate's browser; the response's `Content-Type` says
    which. Recordings are kept for the period agreed with you; after that, `audio_url` is null.

    **The test link** works once: when the candidate has started, opening it again shows a
    "test already started" page instead of a new test.

    **Levels** are the CEFR levels A0, A1, A2, B1, B2, C1 and C2, the same list everywhere. For a
    finer position within a level, the `full` result has an `advanced` block: `level_scale`, the
    score bands used for that test, to read `score` (0–100) against, and `detailed_level`, our own
    split (B1 or B1+). You can ignore it if the level is all you need.

    **Webhooks** — see `test.completed`, `test.graded` and `test.error` below, and
    "Verifying a webhook".

    ## Verifying a webhook

    Every webhook carries `X-Elao-Signature: t=<unix seconds>,v1=<hex>`, where `v1` is the
    HMAC-SHA256 of `"<t>.<raw body>"` with the shared secret. To accept a webhook:

    1. Recompute the HMAC over `t`, a dot and the raw body as received (before any JSON parsing),
       and compare it with `v1` in constant time.
    2. Reject it if `t` is more than 5 minutes away from your clock.
    3. Ignore it if you have already processed its `event_id`. A retried webhook keeps the same
       `event_id` (and gets a new `t`).

    ```js
    const crypto = require("node:crypto");

    function verify(rawBody, header, secret) {
      const parts = Object.fromEntries(header.split(",").map((p) => p.split("=")));
      const expected = crypto.createHmac("sha256", secret).update(`${parts.t}.${rawBody}`).digest("hex");
      const fresh = Math.abs(Date.now() / 1000 - Number(parts.t)) <= 300;
      return fresh && parts.v1?.length === expected.length &&
        crypto.timingSafeEqual(Buffer.from(parts.v1), Buffer.from(expected));
    }
    ```

    **Delivery.** Reply with any 2xx. Otherwise the webhook is sent again 3 times, 1 minute apart
    (4 attempts in all, over about 3 minutes); a 4xx reply is not retried. A webhook is a
    notification only: the status and the result can always be read with `GET /tests/{test_id}`,
    so if your endpoint was down, check the tests you have not seen `graded` yet. Order is not
    guaranteed: rely on `status`, or on `GET /tests/{test_id}`.
  contact:
    name: ELAO
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: speaking.elao-test.com
        description: To be confirmed.
security:
  - apiKey: []

paths:
  /tests:
    post:
      operationId: createTest
      summary: Create a test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestRequest"
            example:
              language: fr
              interface_language: fr
              start_level: B1
              external_ref: "candidate-48213"
              redirect_url: "https://www.elao-test.com/oral/done?ref=candidate-48213"
              completed_callback_url: "https://www.elao-test.com/api/oral-callback"
      responses:
        "201":
          description: Test created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"
              example:
                test_id: "6f1c2a9e-3b4d-4c8a-9e21-7d5b0f3a1c44"
                external_ref: "candidate-48213"
                status: created
                language: fr
                interface_language: fr
                start_level: B1
                test_url: "https://speaking.elao-test.com/?test=6f1c2a9e-3b4d-4c8a-9e21-7d5b0f3a1c44"
                completed_callback_url: "https://www.elao-test.com/api/oral-callback"
                created_at: "2026-11-10T09:00:00Z"
                started_at: null
                completed_at: null
                graded_at: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tests/{test_id}:
    get:
      operationId: getTest
      summary: Get a test's status
      parameters:
        - $ref: "#/components/parameters/TestId"
      responses:
        "200":
          description: The test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"
              example:
                test_id: "6f1c2a9e-3b4d-4c8a-9e21-7d5b0f3a1c44"
                external_ref: "candidate-48213"
                status: graded
                language: fr
                interface_language: fr
                start_level: B1
                test_url: "https://speaking.elao-test.com/?test=6f1c2a9e-3b4d-4c8a-9e21-7d5b0f3a1c44"
                completed_callback_url: "https://www.elao-test.com/api/oral-callback"
                created_at: "2026-11-10T09:00:00Z"
                started_at: "2026-11-10T14:02:11Z"
                completed_at: "2026-11-10T14:07:40Z"
                graded_at: "2026-11-10T14:08:05Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /tests/{test_id}/result:
    get:
      operationId: getTestResult
      summary: Get a test's result
      description: |
        Only available once `status` is `graded`. Each level of detail contains everything in the
        level before it:

        - `summary`: level and score. Also the webhook's `result`.
        - `standard` (default): + the four axes (on 100) and the written feedback: a few words per
          axis, the general summary, strengths, areas for improvement and notable errors.
        - `full`: + the transcript answer by answer (with each word's pronunciation score, the
          speaking rate, the help the candidate asked for and a link to the recording), and
          `advanced` (our finer level, the evaluator's confidence, the score bands and the
          integrity signals).
      parameters:
        - $ref: "#/components/parameters/TestId"
        - name: detail
          in: query
          required: false
          schema:
            type: string
            enum: [summary, standard, full]
            default: standard
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ResultSummary"
                  - $ref: "#/components/schemas/ResultStandard"
                  - $ref: "#/components/schemas/ResultFull"
                discriminator:
                  propertyName: detail
                  mapping:
                    summary: "#/components/schemas/ResultSummary"
                    standard: "#/components/schemas/ResultStandard"
                    full: "#/components/schemas/ResultFull"
              examples:
                summary:
                  $ref: "#/components/examples/ResultSummaryValue"
                standard:
                  summary: detail=standard
                  value:
                    test_id: "6f1c2a9e-3b4d-4c8a-9e21-7d5b0f3a1c44"
                    external_ref: "candidate-48213"
                    language: fr
                    interface_language: fr
                    detail: standard
                    completed_at: "2026-11-10T14:07:40Z"
                    graded_at: "2026-11-10T14:08:05Z"
                    duration_seconds: 329
                    answer_count: 9
                    level: B2
                    score: 72
                    axes:
                      pronunciation: 78
                      fluency: 75
                      vocabulary_grammar: 65
                      communication: 75
                    feedback:
                      fr:
                        translated: true
                        axis_feedback:
                          pronunciation: "La prononciation est claire ; quelques voyelles nasales restent hésitantes."
                          fluency: "Le débit est régulier, avec des pauses surtout sur les sujets abstraits."
                          vocabulary_grammar: "Le vocabulaire est varié ; les accords du participe passé restent fragiles."
                          communication: "Le candidat répond à toutes les questions et développe ses idées."
                        general_summary: "Le candidat s'exprime avec aisance sur des sujets familiers…"
                        strengths: ["Bonne fluidité sur les sujets du quotidien"]
